<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="Staralia — a digital space nation with real citizen accounts." />
  <title>Staralia — Digital Space Nation</title>
  <link rel="stylesheet" href="styles.css" />

  <link rel="manifest" href="manifest-staralia.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Staralia" />
  <script>document.documentElement.classList.add('auth-pending');</script>
  <style id="orbitGateCriticalStyles">
    html.auth-pending body,
    html.auth-locked body{overflow:hidden;background:#050b14}
    html.auth-pending .app-shell,
    html.auth-pending .bottom-nav,
    html.auth-pending .drawer,
    html.auth-pending .drawer-backdrop,
    html.auth-locked .app-shell,
    html.auth-locked .bottom-nav,
    html.auth-locked .drawer,
    html.auth-locked .drawer-backdrop{
      visibility:hidden!important;
      pointer-events:none!important;
      user-select:none!important;
    }
    .auth-gate-shell{
      position:fixed;inset:0;z-index:10000;display:grid;place-items:center;
      overflow:auto;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 20% 15%,rgba(41,96,165,.26),transparent 31%),
        radial-gradient(circle at 86% 24%,rgba(244,185,66,.16),transparent 26%),
        linear-gradient(160deg,#030813,#07111f 56%,#0d1727);
      color:#fff;
    }
    .auth-gate-shell[hidden]{display:none!important}
    .auth-gate-card{
      width:min(470px,100%);border:1px solid rgba(244,185,66,.24);border-radius:28px;
      background:rgba(9,20,35,.94);box-shadow:0 30px 100px rgba(0,0,0,.6);
      padding:28px;backdrop-filter:blur(18px)
    }
    .auth-gate-mark{
      width:78px;height:78px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;
      border:3px solid rgba(244,185,66,.72);background:linear-gradient(145deg,#213d86,#251477);
      font-size:34px;font-weight:950;color:#fff;box-shadow:0 0 50px rgba(244,185,66,.12)
    }
    .auth-gate-kicker{text-align:center;color:#ffd978;letter-spacing:.16em;font-size:12px;font-weight:900}
    .auth-gate-card h1{text-align:center;font-size:34px;line-height:1.08;margin:8px 0 10px}
    .auth-gate-lede{text-align:center;color:#a8b7ca;line-height:1.55;margin:0 auto 22px;max-width:390px}
    .auth-gate-tabs{
      display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#050d18;
      border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:4px;margin:18px 0
    }
    .auth-gate-tab{
      border:0;border-radius:11px;background:transparent;color:#93a5bb;padding:12px;font-weight:900;font-size:15px
    }
    .auth-gate-tab.active{background:rgba(244,185,66,.14);color:#ffd978}
    .auth-gate-form{display:grid;gap:13px}
    .auth-gate-form label{display:grid;gap:7px;color:#d9e2ee;font-size:13px;font-weight:850}
    .auth-gate-input{
      width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.12);border-radius:13px;
      padding:14px;background:#06101d;color:white;font:inherit;outline:none
    }
    .auth-gate-input:focus{border-color:rgba(244,185,66,.7);box-shadow:0 0 0 3px rgba(244,185,66,.08)}
    .auth-gate-submit,.auth-gate-install{
      width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:950
    }
    .auth-gate-submit{background:linear-gradient(135deg,#ffc447,#f2a51f);color:#111827}
    .auth-gate-install{margin-top:12px;border:1px solid rgba(255,255,255,.12);background:#142235;color:#fff}
    .auth-gate-message{min-height:21px;font-size:13px;line-height:1.45;color:#a8b7ca;margin:0}
    .auth-gate-message.error{color:#ff9d9d}.auth-gate-message.success{color:#7be0b8}
    .auth-gate-note{font-size:12px;color:#718399;line-height:1.5;text-align:center;margin:14px 0 0}
    .auth-gate-loading{text-align:center;color:#a8b7ca;font-weight:800}
  </style>

</head>
<body>

  <div id="authGate" class="auth-gate-shell" aria-live="polite">
    <div class="auth-gate-card">
      <div class="auth-gate-mark">✦</div>
      <div class="auth-gate-kicker">STARALIA</div>
      <h1>Citizens only</h1>
      <p class="auth-gate-lede">Create a citizen account or log in to enter the digital nation.</p>
      <div id="authGateContent" class="auth-gate-loading">Checking your citizenship…</div>
    </div>
  </div>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand" role="button" tabindex="0" data-route="home">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <strong>STARALIA</strong>
          <span>Digital Space Nation</span>
        </div>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="sidebar-card">
        <span class="eyebrow">Population</span>
        <strong id="sidebarPopulation">—</strong>
        <small>Registered citizens</small>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open navigation">☰</button>
        <div class="topbar-title">
          <span class="eyebrow" id="sectionKicker">STARALIA</span>
          <h1 id="sectionTitle">Home</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button>
          <button class="icon-btn notification-dot" aria-label="Notifications">◉</button>
          <button class="avatar avatar-sm" id="accountBtn" aria-label="Open account">?</button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-label="All sections">
    <div class="drawer-head">
      <div>
        <span class="eyebrow">STARALIA</span>
        <h2>Nation Menu</h2>
      </div>
      <button class="icon-btn" id="closeDrawer" aria-label="Close menu">×</button>
    </div>
    <div class="drawer-links" id="drawerLinks"></div>
  </aside>

  <div class="toast" id="toast" role="status"></div>

  <template id="homeTemplate">
    <div class="page-grid home-grid">
      <section class="stack">
        <div class="hero-card">
          <div>
            <span class="pill gold">FOUNDING ERA</span>
            <h2 id="citizenWelcome">Welcome to Staralia</h2>
            <p>This is a living digital nation: socialize, vote, build institutions, and help fund real space projects.</p>
            <div class="hero-actions">
              <button class="btn primary" data-route="elections">Vote now</button>
              <button class="btn secondary" data-route="space">View space program</button>
            </div>
          </div>
          <div class="planet-orb" aria-hidden="true"><span></span></div>
        </div>

        <div class="composer card">
          <div class="composer-head">
            <button class="avatar founder-avatar" data-route="profile">W</button>
            <div>
              <strong>Warren</strong>
              <small>Founder & Head of Nation · Official Account</small>
            </div>
          </div>
          <textarea id="postText" maxlength="500" placeholder="Share an update with the nation..."></textarea>
          <div class="composer-actions">
            <span class="muted">Prototype local post composer</span>
            <button class="btn primary" id="postBtn">Post</button>
          </div>
        </div>

        <div id="feedList" class="stack"></div>
      </section>

      <aside class="stack rail">
        <div class="card stat-card">
          <span class="eyebrow">Nation at a glance</span>
          <div class="stat-line"><strong id="homePopulation">—</strong><span>Citizens</span></div>
          <div class="stat-line"><strong>Founding</strong><span>Era</span></div>
          <div class="stat-line"><strong>Live</strong><span>Registration</span></div>
        </div>
        <div class="card">
          <div class="section-row"><h3>Current referendum</h3><button class="text-btn" data-route="elections">Open</button></div>
          <p class="question">Should the nation prioritize its first lunar archive mission?</p>
          <div class="progress"><span style="width:72%"></span></div>
          <small>Prototype vote · database voting comes next</small>
        </div>
        <div class="card">
          <div class="section-row"><h3>Space program</h3><button class="text-btn" data-route="space">Details</button></div>
          <p>Lunar Archive Mission</p>
          <div class="progress blue"><span style="width:43%"></span></div>
          <small>Planning-stage demonstration goal</small>
        </div>
      </aside>
    </div>
  </template>

  <script src="app-v171.js"></script>
  <script src="pwa-v170.js" defer></script>
  <script type="module" src="supabase-auth-v170.js"></script>
  <script type="module" src="auth-gate-v180.js"></script>
  <script type="module" src="live-app-v170.js"></script>
  <script type="module" src="messaging-residency-v171.js"></script>
  <script type="module" src="staralia-civic-v180.js"></script>
  <script src="national-flag-v170.js" defer></script>
  <script src="national-emblem-v170.js" defer></script>
  <script src="staralia-header-v172.js" defer></script>
</body>
</html>
