  <script type="module">
  (async () => {
    'use strict';
    const GROUP_ICON_1230=`<svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.5" y="3.5" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="13.5" y="3.5" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="3.5" y="13.5" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="13.5" y="13.5" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="7" cy="7" r="1.25" fill="currentColor"/>
      <circle cx="17" cy="7" r="1.25" fill="currentColor"/>
      <circle cx="7" cy="17" r="1.25" fill="currentColor"/>
      <circle cx="17" cy="17" r="1.25" fill="currentColor"/>
    </svg>`;
    const gs={db:null,profile:null,citizens:[],groups:[],memberships:[],mode:'discover',search:'',modal:null};
    const waitDb=async()=>{for(let i=0;i<120;i++){if(window.projectOrbitDb)return window.projectOrbitDb;await new Promise(r=>setTimeout(r,50));}throw new Error('Starvalla database client did not initialize');};
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const pad=v=>String(v??'').padStart(6,'0');
    const toast=m=>{const e=document.querySelector('#toast');if(!e){alert(m);return;}e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400);};
    const rel=iso=>{const sec=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/1000));if(sec<45)return'just now';const m=Math.floor(sec/60);if(m<60)return`${m}m ago`;const h=Math.floor(m/60);if(h<24)return`${h}h ago`;const d=Math.floor(h/24);if(d<30)return`${d}d ago`;return new Date(iso).toLocaleDateString();};
    const categoryIcon=g=>{const t=`${g?.name||''} ${g?.category||''}`.toLowerCase();if(t.includes('anime')||t.includes('manga'))return'🌸';if(t.includes('game'))return'🎮';if(t.includes('space')||t.includes('venus')||t.includes('astronomy'))return'🚀';if(t.includes('tech')||t.includes('computer')||t.includes('ai'))return'💻';if(t.includes('music'))return'♫';if(t.includes('art'))return'✦';if(t.includes('book')||t.includes('writing'))return'📚';if(t.includes('fitness')||t.includes('sport'))return'⚡';return'◎';};
    const citizen=no=>gs.citizens.find(c=>Number(c.citizen_no)===Number(no))||null;
    const membershipFor=id=>gs.memberships.find(m=>Number(m.group_id)===Number(id)&&Number(m.citizen_no)===Number(gs.profile?.citizen_no))||null;
    const isOwner=g=>Number(g?.owner_citizen_no)===Number(gs.profile?.citizen_no);
    const isActiveMember=g=>isOwner(g)||membershipFor(g.id)?.status==='active';

    async function refresh(){const [mine,cits,groups,memberships]=await Promise.all([gs.db.rpc('my_profile'),gs.db.from('profiles').select('citizen_no,display_name,avatar_url,role,is_founder,account_type').order('citizen_no'),gs.db.from('groups').select('*').order('member_count',{ascending:false}).order('created_at',{ascending:true}),gs.db.from('group_memberships').select('*')]);gs.profile=mine.data?.[0]||null;gs.citizens=cits.data||[];gs.groups=groups.data||[];gs.memberships=memberships.data||[];}

    function ensureModal(){if(gs.modal)return gs.modal;const w=document.createElement('div');w.className='sv1230-modal';w.innerHTML=`<div class="sv1230-dialog"><div class="sv1230-modal-head"><div><span class="eyebrow">STARVALLA GROUPS</span><h2>Create a Group</h2></div><button class="sv1230-close" type="button">×</button></div><form class="sv1230-form" id="sv1230CreateForm"><label>Group name<input name="name" minlength="2" maxlength="42" required placeholder="Anime, Outer Space, Video Games…"></label><label>Category<input name="category" minlength="2" maxlength="60" required placeholder="Entertainment, Gaming, Science & Space…"></label><label>Description<textarea name="description" maxlength="500" required placeholder="What is this group about?"></textarea></label><div><strong style="display:block;margin-bottom:9px">Privacy</strong><div class="sv1230-privacy-grid"><label class="sv1230-privacy"><input type="radio" name="privacy" value="public" checked><span><strong>Public</strong><span>All citizens can view the wall. Anyone can join instantly.</span></span></label><label class="sv1230-privacy"><input type="radio" name="privacy" value="private"><span><strong>Private</strong><span>The group is discoverable, but its wall is visible only to approved members.</span></span></label></div></div><button class="btn primary" type="submit">Create Group</button></form></div>`;document.body.appendChild(w);w.querySelector('.sv1230-close').onclick=()=>w.classList.remove('show');w.addEventListener('click',e=>{if(e.target===w)w.classList.remove('show');});w.querySelector('#sv1230CreateForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),b=e.currentTarget.querySelector('button[type="submit"]');b.disabled=true;b.textContent='Creating…';const r=await gs.db.from('groups').insert({name:String(f.get('name')||'').trim(),category:String(f.get('category')||'').trim(),description:String(f.get('description')||'').trim(),privacy:String(f.get('privacy')||'public')}).select('*').single();if(r.error){b.disabled=false;b.textContent='Create Group';return toast(String(r.error.message||'').includes('groups_name_lower_unique')?'A group with that name already exists.':r.error.message);}w.classList.remove('show');e.currentTarget.reset();await refresh();toast('Group created.');openGroup(r.data.id);});gs.modal=w;return w;}
    function openCreate(){if(!gs.profile){document.querySelector('#accountBtn')?.click();return;}ensureModal().classList.add('show');}
    function visibleGroups(){const q=gs.search.trim().toLowerCase();let list=gs.groups;if(gs.mode==='mine'){const ids=new Set(gs.memberships.filter(m=>Number(m.citizen_no)===Number(gs.profile?.citizen_no)).map(m=>Number(m.group_id)));list=list.filter(g=>isOwner(g)||ids.has(Number(g.id)));}if(q)list=list.filter(g=>[g.name,g.description,g.category,g.privacy].join(' ').toLowerCase().includes(q));return list;}
    function groupCard(g){const m=membershipFor(g.id),owner=isOwner(g);let action='Open',cls='secondary';if(owner)action='Owner';else if(m?.status==='active')action='Joined';else if(m?.status==='pending')action='Pending';else{action=g.privacy==='public'?'Join':'Request';cls='';}return `<div class="sv1230-card" data-sv1230-open="${g.id}"><span class="sv1230-icon">${categoryIcon(g)}</span><div><h3>${esc(g.name)}</h3><p>${esc(g.description)}</p><div class="sv1230-meta"><span>${esc(g.category)}</span><span>•</span><span>${Number(g.member_count||1)} member${Number(g.member_count||1)===1?'':'s'}</span><span class="sv1230-badge ${g.privacy==='public'?'sv1230-public':'sv1230-private'}">${g.privacy==='public'?'PUBLIC':'PRIVATE'}</span>${m?.status==='pending'?'<span class="sv1230-badge sv1230-pending">REQUEST PENDING</span>':''}</div></div><button type="button" class="sv1230-join ${cls}" data-sv1230-action="${g.id}">${action}</button></div>`;}
    function drawDirectory(){const list=document.querySelector('#sv1230List');if(!list)return;const groups=visibleGroups();list.innerHTML=groups.length?groups.map(groupCard).join(''):'<div class="card sv1230-empty">No groups match this view yet.</div>';list.querySelectorAll('[data-sv1230-open]').forEach(card=>card.addEventListener('click',e=>{if(e.target.closest('[data-sv1230-action]'))return;openGroup(Number(card.dataset.sv1230Open));}));list.querySelectorAll('[data-sv1230-action]').forEach(button=>button.addEventListener('click',async e=>{e.stopPropagation();const id=Number(button.dataset.sv1230Action),g=gs.groups.find(x=>Number(x.id)===id),m=membershipFor(id);if(!g)return;if(isOwner(g)||m?.status==='active'||m?.status==='pending')return openGroup(id);button.disabled=true;button.textContent=g.privacy==='public'?'Joining…':'Requesting…';const r=await gs.db.from('group_memberships').insert({group_id:id});if(r.error){button.disabled=false;return toast(r.error.message);}await refresh();toast(g.privacy==='public'?'Joined group.':'Request sent to the group owner.');drawDirectory();}));}

    async function renderGroups(){document.querySelector('#sectionTitle')&&(document.querySelector('#sectionTitle').textContent='Groups');document.querySelector('#sectionKicker')&&(document.querySelector('#sectionKicker').textContent='COMMUNITIES');await refresh();const v=document.querySelector('#view');if(!v)return;v.innerHTML=`<div class="sv1230-page"><section class="sv1230-head"><div><span class="eyebrow">CITIZEN COMMUNITIES</span><h2>Groups</h2><p>Find people who share your interests — or create a community of your own.</p></div><button class="sv1230-create" type="button" id="sv1230Create" aria-label="Create group" title="Create group">＋</button></section><section class="sv1230-toolbar"><input class="sv1230-search" id="sv1230Search" placeholder="Search Anime, Outer Space, games, technology…"><div class="sv1230-tabs"><button class="sv1230-tab ${gs.mode==='discover'?'active':''}" data-sv1230-mode="discover">Discover</button><button class="sv1230-tab ${gs.mode==='mine'?'active':''}" data-sv1230-mode="mine">My Groups</button></div></section><section class="sv1230-list" id="sv1230List"></section></div>`;document.querySelector('#sv1230Create')?.addEventListener('click',openCreate);document.querySelector('#sv1230Search')?.addEventListener('input',e=>{gs.search=e.target.value;drawDirectory();});document.querySelectorAll('[data-sv1230-mode]').forEach(btn=>btn.addEventListener('click',()=>{gs.mode=btn.dataset.sv1230Mode;document.querySelectorAll('[data-sv1230-mode]').forEach(x=>x.classList.toggle('active',x===btn));drawDirectory();}));drawDirectory();}
    function avatarMarkup(p){const u=String(p?.avatar_url||'');return /^https?:\/\//i.test(u)?`<span class="sv1230-avatar"><img src="${esc(u)}" alt=""></span>`:`<span class="sv1230-avatar">${esc((p?.display_name||'C').charAt(0).toUpperCase())}</span>`;}

    async function openGroup(groupId){await refresh();const g=gs.groups.find(x=>Number(x.id)===Number(groupId));if(!g)return renderGroups();document.querySelector('#sectionTitle')&&(document.querySelector('#sectionTitle').textContent=g.name);document.querySelector('#sectionKicker')&&(document.querySelector('#sectionKicker').textContent='GROUP');const m=membershipFor(g.id),owner=isOwner(g),active=isActiveMember(g),canSee=g.privacy==='public'||active;const [pr,rr]=await Promise.all([canSee?gs.db.from('group_posts').select('*').eq('group_id',g.id).order('created_at',{ascending:false}).limit(100):Promise.resolve({data:[]}),owner?gs.db.from('group_memberships').select('*').eq('group_id',g.id).eq('status','pending').order('requested_at'):Promise.resolve({data:[]})]);const posts=pr.data||[],requests=rr.data||[];let action='';if(owner)action='<span class="sv1230-badge sv1230-public">OWNER</span>';else if(m?.status==='active')action='<button class="btn secondary" id="sv1230Leave">Leave Group</button>';else if(m?.status==='pending')action='<button class="btn secondary" id="sv1230CancelRequest">Cancel Request</button>';else action=`<button class="btn primary" id="sv1230Join">${g.privacy==='public'?'Join Group':'Request to Join'}</button>`;const req=owner&&requests.length?`<section class="card"><h3>Membership Requests · ${requests.length}</h3><div class="sv1230-requests">${requests.map(r=>{const p=citizen(r.citizen_no);return `<div class="sv1230-request"><div class="sv1230-author">${avatarMarkup(p)}<div><strong>${esc(p?.display_name||`Citizen #${pad(r.citizen_no)}`)}</strong><small class="muted">Citizen #${pad(r.citizen_no)}</small></div></div><div class="sv1230-actions"><button class="btn secondary" data-sv1230-approve="${r.citizen_no}">Approve</button><button class="btn secondary" data-sv1230-reject="${r.citizen_no}">Reject</button></div></div>`;}).join('')}</div></section>`:'';const compose=active?`<section class="sv1230-compose"><textarea id="sv1230GroupPostText" maxlength="1500" placeholder="Share something with ${esc(g.name)}…"></textarea><button class="btn primary" id="sv1230GroupPost">Post</button></section>`:'';const wall=!canSee?`<section class="card sv1230-lock"><div class="lock">◇</div><h3>Private Group</h3><p class="muted">Join requests must be approved before the group wall becomes visible.</p></section>`:`<section class="sv1230-wall" id="sv1230Wall">${posts.length?posts.map(post=>{const a=citizen(post.author_citizen_no),del=owner||Number(post.author_citizen_no)===Number(gs.profile?.citizen_no);return `<article class="sv1230-group-post"><div class="sv1230-post-head"><div class="sv1230-author">${avatarMarkup(a)}<div><strong>${esc(a?.display_name||'Citizen')} ${a?.is_founder?'✓':''}</strong><small class="muted">${rel(post.created_at)}</small></div></div>${del?`<button class="text-btn" data-sv1230-delete-post="${post.id}">Delete</button>`:''}</div><p>${esc(post.body)}</p></article>`;}).join(''):'<div class="card sv1230-empty">No posts yet. Be the first to start the conversation.</div>'}</section>`;const v=document.querySelector('#view');v.innerHTML=`<div class="sv1230-page"><section class="sv1230-group-hero"><span class="sv1230-icon">${categoryIcon(g)}</span><div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px"><span class="sv1230-badge ${g.privacy==='public'?'sv1230-public':'sv1230-private'}">${g.privacy==='public'?'PUBLIC GROUP':'PRIVATE GROUP'}</span><span class="sv1230-badge">${esc(g.category)}</span></div><h2>${esc(g.name)}</h2><p>${esc(g.description)}</p><div class="sv1230-meta"><span>${Number(g.member_count||1)} member${Number(g.member_count||1)===1?'':'s'}</span><span>•</span><span>Created by ${esc(citizen(g.owner_citizen_no)?.display_name||`Citizen #${pad(g.owner_citizen_no)}`)}</span></div></div><div class="sv1230-hero-actions"><button class="btn secondary" id="sv1230Back">← Groups</button>${action}</div></section>${req}${compose}${wall}</div>`;document.querySelector('#sv1230Back')?.addEventListener('click',renderGroups);document.querySelector('#sv1230Join')?.addEventListener('click',async()=>{const r=await gs.db.from('group_memberships').insert({group_id:g.id});if(r.error)return toast(r.error.message);toast(g.privacy==='public'?'Joined group.':'Request sent.');openGroup(g.id);});document.querySelector('#sv1230Leave')?.addEventListener('click',async()=>{if(!confirm(`Leave ${g.name}?`))return;const r=await gs.db.from('group_memberships').delete().eq('group_id',g.id).eq('citizen_no',gs.profile.citizen_no);if(r.error)return toast(r.error.message);toast('Left group.');openGroup(g.id);});document.querySelector('#sv1230CancelRequest')?.addEventListener('click',async()=>{const r=await gs.db.from('group_memberships').delete().eq('group_id',g.id).eq('citizen_no',gs.profile.citizen_no);if(r.error)return toast(r.error.message);toast('Join request cancelled.');openGroup(g.id);});document.querySelector('#sv1230GroupPost')?.addEventListener('click',async()=>{const text=(document.querySelector('#sv1230GroupPostText')?.value||'').trim();if(!text)return toast('Write something first.');const b=document.querySelector('#sv1230GroupPost');b.disabled=true;const r=await gs.db.from('group_posts').insert({group_id:g.id,body:text});if(r.error){b.disabled=false;return toast(r.error.message);}toast('Posted to the group.');openGroup(g.id);});document.querySelectorAll('[data-sv1230-delete-post]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Delete this group post?'))return;const r=await gs.db.from('group_posts').delete().eq('id',Number(b.dataset.sv1230DeletePost));if(r.error)return toast(r.error.message);openGroup(g.id);}));document.querySelectorAll('[data-sv1230-approve]').forEach(b=>b.addEventListener('click',async()=>{const no=Number(b.dataset.sv1230Approve);const r=await gs.db.from('group_memberships').update({status:'active',joined_at:new Date().toISOString()}).eq('group_id',g.id).eq('citizen_no',no);if(r.error)return toast(r.error.message);toast('Member approved.');openGroup(g.id);}));document.querySelectorAll('[data-sv1230-reject]').forEach(b=>b.addEventListener('click',async()=>{const no=Number(b.dataset.sv1230Reject);const r=await gs.db.from('group_memberships').delete().eq('group_id',g.id).eq('citizen_no',no);if(r.error)return toast(r.error.message);toast('Request rejected.');openGroup(g.id);}));}

    function patchNavigation(){if(typeof routeMeta!=='undefined'){if(!routeMeta.groups){const mi=routes.findIndex(r=>r[0]==='more'),entry=['groups',GROUP_ICON_1230,'Groups'];if(mi>=0)routes.splice(mi,0,entry);else routes.push(entry);routeMeta.groups={icon:GROUP_ICON_1230,label:'Groups'};}else{routeMeta.groups.icon=GROUP_ICON_1230;routeMeta.groups.label='Groups';}}if(Array.isArray(mainMobile))mainMobile.splice(0,mainMobile.length,'home','citizens','messages','groups','more');if(typeof renderNav==='function')renderNav();document.querySelectorAll('#bottomNav [data-route="groups"]').forEach(btn=>{btn.setAttribute('aria-label','Groups');btn.setAttribute('title','Groups');});}
    const previousRenderRoute=renderRoute;renderRoute=function(){if(state.route==='groups')return renderGroups();return previousRenderRoute();};
    patchNavigation();
    const bottom=document.querySelector('#bottomNav');if(bottom){let nt=null;new MutationObserver(()=>{clearTimeout(nt);nt=setTimeout(()=>{const g=bottom.querySelector('[data-route="groups"]'),w=bottom.querySelector('[data-route="world"]'),n=bottom.querySelector('[data-route="news"]');if(!g||w||n)patchNavigation();},25);}).observe(bottom,{childList:true,subtree:true});}
    gs.db=await waitDb();await refresh().catch(()=>{});gs.db.auth.onAuthStateChange(async()=>{await refresh().catch(()=>{});patchNavigation();if(location.hash==='#groups')renderGroups();});window.addEventListener('hashchange',()=>setTimeout(()=>{patchNavigation();if(location.hash==='#groups')renderGroups();},25));if(location.hash==='#groups')renderGroups();
  })();

  <script>
  (() => {

    function removeClosedPropositions1231(){
      const home =
        document.querySelector('#sectionTitle')?.textContent?.trim()==='Home' ||
        location.hash==='#home' ||
        !location.hash;

      if(!home)return;

      document.querySelectorAll('#svBallotFeed1180 [data-sv-ballot-card^="proposition:"]').forEach(card=>{
        const text=(card.textContent||'').replace(/\s+/g,' ').toLowerCase();
        if(text.includes('voting closed')){
          card.remove();
        }
      });
    }

    removeClosedPropositions1231();

    const view1231=document.querySelector('#view');
    if(view1231){
      let timer1231=null;
      new MutationObserver(()=>{
        clearTimeout(timer1231);
        timer1231=setTimeout(removeClosedPropositions1231,20);
      }).observe(view1231,{childList:true,subtree:true});
    }

    window.addEventListener('hashchange',()=>setTimeout(removeClosedPropositions1231,20));
    window.__starvallaFix1231=true;
  })();
  </script>
