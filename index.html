  <!-- Starvalla First-Paint Branding Guard v1.18.4 -->
  <script>
  (() => {
    'use strict';

    const replaceBrand = value => String(value ?? '')
      .replace(/STARALIA/g, 'STARVALLA')
      .replace(/Staralia/g, 'Starvalla')
      .replace(/staralia/g, 'starvalla');

    function fixNode(node) {
      if (!node) return;

      if (node.nodeType === Node.TEXT_NODE) {
        const next = replaceBrand(node.nodeValue);
        if (next !== node.nodeValue) node.nodeValue = next;
        return;
      }

      if (node.nodeType !== Node.ELEMENT_NODE) return;

      for (const attr of ['title','aria-label','placeholder','alt']) {
        if (node.hasAttribute?.(attr)) {
          const oldValue = node.getAttribute(attr);
          const newValue = replaceBrand(oldValue);
          if (newValue !== oldValue) node.setAttribute(attr, newValue);
        }
      }

      node.childNodes?.forEach(fixNode);
    }

    const root = document.documentElement;

    /*
      Older JavaScript modules still contain the former Staralia name.
      MutationObserver callbacks run at the microtask checkpoint after those
      DOM writes and before the browser paints the next frame, so the user
      never sees the old branding flash during startup or route changes.
    */
    const observer = new MutationObserver(mutations => {
      for (const mutation of mutations) {
        if (mutation.type === 'characterData') {
          fixNode(mutation.target);
        } else {
          mutation.addedNodes?.forEach(fixNode);
        }
      }

      const nextTitle = replaceBrand(document.title);
      if (nextTitle !== document.title) document.title = nextTitle;
    });

    observer.observe(root, {
      childList: true,
      subtree: true,
      characterData: true
    });

    document.addEventListener('DOMContentLoaded', () => {
      fixNode(document.body);
      document.title = replaceBrand(document.title);
    }, { once: true });
  })();
  </script>

  <script type="module">
const waitForStarvallaDb1130 = async () => {
  for (let i = 0; i < 120; i++) {
    if (window.projectOrbitDb) return window.projectOrbitDb;
    await new Promise(resolve => setTimeout(resolve, 50));
  }
  throw new Error('Starvalla database client did not initialize');
};

const officeDb1130 = await waitForStarvallaDb1130();

const officeState1130 = {
  citizens: [],
  terms: [],
  me: null,
  residency: null
};

const esc1130 = value => String(value ?? '').replace(/[&<>'"]/g, char => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
}[char]));

const pad1130 = value => String(value ?? '').padStart(6, '0');

const officePriority1130 = {
  president: 1,
  judge: 2,
  senator: 3,
  representative: 4
};

function citizen1130(citizenNo) {
  return officeState1130.citizens.find(c => Number(c.citizen_no) === Number(citizenNo)) || null;
}

function officeTerms1130(citizenNo) {
  return officeState1130.terms
    .filter(term => Number(term.citizen_no) === Number(citizenNo))
    .sort((a, b) => {
      const activeDelta = Number(Boolean(a.ended_at)) - Number(Boolean(b.ended_at));
      if (activeDelta) return activeDelta;
      const priorityDelta = (officePriority1130[a.office_type] || 99) - (officePriority1130[b.office_type] || 99);
      if (priorityDelta) return priorityDelta;
      return new Date(b.started_at).getTime() - new Date(a.started_at).getTime();
    });
}

function activeOffices1130(citizenNo) {
  return officeTerms1130(citizenNo).filter(term => !term.ended_at);
}

function currentTitle1130(citizen) {
  return activeOffices1130(citizen?.citizen_no)?.[0]?.title || citizen?.role || 'Citizen';
}

function date1130(value) {
  if (!value) return 'Present';
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime())
    ? ''
    : parsed.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function citizenNoFromText1130(text) {
  const match = String(text || '').match(/#(\d{1,6})/);
  return match ? Number(match[1]) : 0;
}

    .senate-member-row.staralia-office-row{cursor:pointer;border-radius:10px;padding-left:6px;padding-right:6px}

  document.head.appendChild(style);

async function loadOfficeState1130() {
  const [citizensResult, termsResult, sessionResult] = await Promise.all([
    officeDb1130
      .from('profiles')
      .select('citizen_no,display_name,country,role,is_founder,account_type,joined_at')
      .order('citizen_no', { ascending: true }),
    officeDb1130
      .from('office_terms')
      .select('id,citizen_no,office_type,title,branch,chamber,seat_no,source,started_at,ended_at,end_reason')
      .order('started_at', { ascending: false }),
    officeDb1130.auth.getSession()
  ]);

  if (!citizensResult.error) officeState1130.citizens = citizensResult.data || [];
  if (!termsResult.error) officeState1130.terms = termsResult.data || [];

  officeState1130.me = null;
  officeState1130.residency = null;

  if (sessionResult?.data?.session?.user) {
    const mine = await officeDb1130.rpc('my_profile');
    officeState1130.me = mine.data?.[0] || null;
    if (officeState1130.me?.citizen_no) {
      const residency = await officeDb1130
        .from('residencies')
        .select('citizen_no,status,price_cents,currency,paid_at,resident_since')
        .eq('citizen_no', officeState1130.me.citizen_no)
        .maybeSingle();
      officeState1130.residency = residency.data || null;
    }
  }
}

function decoratePopulation1130() {
  const humans = officeState1130.citizens.filter(c => c.account_type !== 'ai');
  const population = humans.length;

  const sidebar = document.querySelector('#sidebarPopulation');
  const home = document.querySelector('#homePopulation');
  if (sidebar && sidebar.textContent !== population.toLocaleString()) sidebar.textContent = population.toLocaleString();
  if (home && home.textContent !== population.toLocaleString()) home.textContent = population.toLocaleString();

  if (document.querySelector('#sectionTitle')?.textContent === 'Citizens') {
    const metrics = document.querySelectorAll('#view .metric');
    const today = new Date().toISOString().slice(0, 10);
    const month = today.slice(0, 7);
    const countries = new Set(humans.map(c => c.country?.trim()).filter(Boolean)).size;
    const todayCount = humans.filter(c => String(c.joined_at).slice(0, 10) === today).length;
    const monthCount = humans.filter(c => String(c.joined_at).slice(0, 7) === month).length;

    if (metrics[0]) {
      const strong = metrics[0].querySelector('strong');
      const small = metrics[0].querySelector('small');
      if (strong) strong.textContent = population.toLocaleString();
      if (small) small.textContent = `+${monthCount} this month`;
    }
    if (metrics[1]) {
      const strong = metrics[1].querySelector('strong');
      const small = metrics[1].querySelector('small');
      if (strong) strong.textContent = countries.toLocaleString();
      if (small) small.textContent = countries ? 'Countries represented by human citizens' : 'Add your country in your profile';
    }
    if (metrics[2]) {
      const strong = metrics[2].querySelector('strong');
      const small = metrics[2].querySelector('small');
      if (strong) strong.textContent = todayCount.toLocaleString();
      if (small) small.textContent = todayCount === 1 ? 'New human citizen today' : 'New human citizens today';
    }
  }
}

function decorateCitizenDirectory1130() {
  document.querySelectorAll('#citizenList .citizen-row').forEach(row => {
    const citizenNo = citizenNoFromText1130(row.querySelector('.citizen-number')?.textContent);
    const citizen = citizen1130(citizenNo);
    if (!citizen) return;

    const strong = row.querySelector('.identity-meta strong');
    const small = row.querySelector('.identity-meta small');
    const flag = row.querySelector('.flag,.country-text');

    if (flag && citizen.account_type === 'ai' && flag.textContent !== '🤖') flag.textContent = '🤖';

    if (strong) {
      strong.querySelectorAll('.staralia-mini-ai,.staralia-mini-office').forEach(el => el.remove());
      if (citizen.account_type === 'ai') {
        const badge = document.createElement('span');
        badge.className = 'staralia-mini-ai';
        badge.textContent = 'AI';
        strong.appendChild(badge);
      }
      const office = activeOffices1130(citizenNo)[0];
      if (office) {
        const badge = document.createElement('span');
        badge.className = 'staralia-mini-office';
        badge.textContent = String(office.title || '').toUpperCase();
        strong.appendChild(badge);
      }
    }

    if (small) {
      const desired = `${currentTitle1130(citizen)}${citizen.country ? ` · ${citizen.country}` : ''}`;
      if (small.textContent !== desired) small.textContent = desired;
    }
  });
}

function serviceMarkup1130(citizenNo) {
  const terms = officeTerms1130(citizenNo);
  if (!terms.length) return '';

  return `<div class="card staralia-service-card" data-office-service-card="1">
    <div class="section-row">
      <div><span class="eyebrow">PUBLIC RECORD</span><h3>Government service</h3></div>
      <span class="pill blue">${terms.length} TERM${terms.length === 1 ? '' : 'S'}</span>
    </div>
    ${terms.map(term => {
      const active = !term.ended_at;
      const seat = term.seat_no ? ` · Seat ${term.seat_no}` : '';
      const chamber = term.chamber ? String(term.chamber).replaceAll('_', ' ').replace(/\b\w/g, c => c.toUpperCase()) : String(term.branch || '').replace(/\b\w/g, c => c.toUpperCase());
      const reason = !active && term.end_reason ? ` · ${esc1130(term.end_reason)}` : '';
      return `<div class="staralia-service-row">
        <div>
          <strong>${esc1130(term.title)}</strong>
          <small>${esc1130(chamber)}${seat} · ${date1130(term.started_at)} – ${date1130(term.ended_at)}${reason}</small>
        </div>
        <span class="pill ${active ? 'green' : 'blue'} staralia-service-status">${active ? 'CURRENT' : 'FORMER'}</span>
      </div>`;
    }).join('')}
  </div>`;
}

function decorateProfile1130() {
  const page = document.querySelector('#view .profile-page');
  if (!page) return;

  let citizenNo = Number(String(new URL(location.href).searchParams.get('citizen') || '').replace(/\D/g, ''));
  if (!citizenNo) citizenNo = citizenNoFromText1130(page.querySelector('.profile-meta')?.textContent);
  if (!citizenNo && document.querySelector('#sectionTitle')?.textContent === 'President Profile') citizenNo = 1;

  const citizen = citizen1130(citizenNo);
  if (!citizen) return;

  const nameRow = page.querySelector('.profile-page-name');
  if (nameRow) {
    nameRow.querySelectorAll('.staralia-ai-badge,.staralia-office-badge').forEach(el => el.remove());

    if (citizen.account_type === 'ai') {
      const ai = document.createElement('span');
      ai.className = 'staralia-ai-badge';
      ai.textContent = 'AI CITIZEN';
      nameRow.appendChild(ai);
    }

function rebrandNode1140(root) {
  if (!root) return;

  if (root.nodeType === Node.TEXT_NODE) {

    const next = brandText1140(root.nodeValue);
    if (next !== root.nodeValue) root.nodeValue = next;
    return;
  }

  if (root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_FRAGMENT_NODE) return;

  if (root.nodeType === Node.ELEMENT_NODE) {
    const el = root;
    if (['SCRIPT','STYLE','NOSCRIPT'].includes(el.tagName)) return;
    for (const attr of ['title','aria-label','placeholder','value']) {
      if (el.hasAttribute?.(attr)) {
        const old = el.getAttribute(attr);
        const next = brandText1140(old);
        if (old !== next) el.setAttribute(attr, next);
      }
    }
  }

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => rebrandNode1140(node));
}

          elections:svBallot1180.senateElections,
          candidates:svBallot1180.senateCandidates,
          tallies:svBallot1180.senateTallies,
          votes:svBallot1180.senateVotes
        };
  }

  function svElectionCard1180(kind,election){
    const d=svElectionData1180(kind);
    const open=svOpen1180(election);
    const candidates=d.candidates.filter(c=>Number(c.election_id)===Number(election.id));
    const mine=d.votes.find(v=>Number(v.election_id)===Number(election.id));
    const showResults=!!mine||!open;
    const creator=svCitizen1180(election.created_by_citizen_no)||svCitizen1180(1)||{display_name:'Starvalla'};
    const winner=svCitizen1180(election.winner_citizen_no);

    const rows=candidates.map(candidate=>{
      const person=svCitizen1180(candidate.citizen_no)||{display_name:'Citizen'};
      const tally=d.tallies.find(t=>Number(t.election_id)===Number(election.id)&&Number(t.candidate_citizen_no)===Number(candidate.citizen_no));
      const count=Number(tally?.vote_count||0);
      const selected=Number(mine?.candidate_citizen_no)===Number(candidate.citizen_no);

      return `<div class="sv-candidate">
        <div>
          <strong>${svEsc1180(person.display_name)}${person.is_founder?' ✓':''}</strong>
          <small>Citizen #${svPad1180(candidate.citizen_no)}${candidate.statement?` · ${svEsc1180(candidate.statement)}`:''}</small>
          ${showResults?`<span class="sv-candidate-count">${count} vote${count===1?'':'s'}</span>`:''}
        </div>
        ${open?`<button class="sv-candidate-vote ${selected?'selected':''}" data-sv-election-vote="${kind}:${election.id}:${candidate.citizen_no}" ${selected?'disabled':''}>
          ${selected?'✓ Your vote':mine?'Change vote':'Vote'}
        </button>`:''}
      </div>`;
    }).join('');

    const resultRows=showResults?svResultRows1180(candidates.map(candidate=>{
      const person=svCitizen1180(candidate.citizen_no)||{display_name:'Citizen'};
      const tally=d.tallies.find(t=>Number(t.election_id)===Number(election.id)&&Number(t.candidate_citizen_no)===Number(candidate.citizen_no));
      return {label:person.display_name,count:Number(tally?.vote_count||0)};
    })):`<div class="sv-ballot-status">Vote counts stay hidden until you cast your ballot.</div>`;

    return `<article class="card sv-ballot-card" data-sv-ballot-card="${kind}:${election.id}">
      <div class="sv-ballot-head">
        ${svAvatar1180(creator)}
        <div class="sv-ballot-head-copy">
          <strong>${svEsc1180(creator.display_name)}${creator.is_founder?' ✓':''}</strong>
          <small>${creator.is_founder?'President of Starvalla · ':''}Election administration</small>
        </div>
        <span class="sv-ballot-badge">OFFICIAL ${kind==='house'?'HOUSE':'SENATE'} ELECTION</span>
      </div>

      <div class="eyebrow">${svEsc1180(d.label.toUpperCase())} · SEAT ${svEsc1180(election.seat_no)}</div>
      <h3 class="sv-ballot-title">${svEsc1180(election.title)}</h3>
      ${election.description?`<p class="sv-ballot-description">${svEsc1180(election.description)}</p>`:''}

      <div class="sv-ballot-meta">
        <span>${open?svWhen1180(election.closes_at):'Voting closed'}</span>
        <span>Elect one ${svEsc1180(d.member)}</span>
      </div>

      <div class="sv-candidates">
        ${rows||'<p class="muted">No candidates are registered yet.</p>'}
      </div>

      ${resultRows}
      ${mine&&open?`<div class="sv-ballot-status">You may change your candidate selection until voting closes.</div>`:''}
      ${!open?`<div class="sv-ballot-status result">${winner?`WINNER · ${svEsc1180(winner.display_name)}`:election.status==='tied'?'TIED · no winner seated yet':'Voting closed'}</div>`:''}

      ${svDiscussion1180(kind,election.id)}
      <button class="sv-feed-link" type="button" data-route="elections">View full election →</button>
    </article>`;
  }

  async function svLoad1180(){
    const [
      profileRes,citizensRes,
      propsRes,propTalliesRes,propVotesRes,
      houseElectionsRes,houseCandidatesRes,houseTalliesRes,houseVotesRes,
      senateElectionsRes,senateCandidatesRes,senateTalliesRes,senateVotesRes,
      commentsRes
    ]=await Promise.all([
      svDb1180.rpc('my_profile'),
      svDb1180.from('profiles').select('citizen_no,display_name,avatar_url,role,is_founder,account_type').order('citizen_no').limit(500),
      svDb1180.from('propositions').select('id,proposition_number,title,description,status,opens_at,closes_at,decided_at,created_at,created_by_citizen_no').order('created_at',{ascending:false}),
      svDb1180.from('proposition_tallies').select('proposition_id,yes_count,no_count'),
      svDb1180.from('proposition_votes').select('proposition_id,citizen_no,vote,created_at'),
      svDb1180.from('house_elections').select('id,title,description,seat_no,status,opens_at,closes_at,winner_citizen_no,created_at,created_by_citizen_no').order('created_at',{ascending:false}),
      svDb1180.from('house_candidates').select('election_id,citizen_no,statement,created_at').order('created_at'),
      svDb1180.from('house_candidate_tallies').select('election_id,candidate_citizen_no,vote_count'),
      svDb1180.from('house_election_votes').select('election_id,voter_citizen_no,candidate_citizen_no,created_at'),
      svDb1180.from('senate_elections').select('id,title,description,seat_no,status,opens_at,closes_at,winner_citizen_no,created_at,created_by_citizen_no').order('created_at',{ascending:false}),
      svDb1180.from('senate_candidates').select('election_id,citizen_no,statement,created_at').order('created_at'),
      svDb1180.from('senate_candidate_tallies').select('election_id,candidate_citizen_no,vote_count'),

      svDb1180.from('civic_ballot_comments').select('id,ballot_kind,ballot_id,citizen_no,body,created_at').order('created_at',{ascending:true}).limit(1000)

    if(profileRes.error) console.warn('Social ballot profile',profileRes.error);
    if(citizensRes.error) console.warn('Social ballot citizens',citizensRes.error);

    svBallot1180.profile=profileRes.data?.[0]||null;
    svBallot1180.citizens=citizensRes.data||[];
    svBallot1180.propositions=propsRes.data||[];
    svBallot1180.propositionTallies=propTalliesRes.data||[];
    svBallot1180.propositionVotes=propVotesRes.data||[];
    svBallot1180.houseElections=houseElectionsRes.data||[];
    svBallot1180.houseCandidates=houseCandidatesRes.data||[];
    svBallot1180.houseTallies=houseTalliesRes.data||[];
    svBallot1180.houseVotes=houseVotesRes.data||[];
    svBallot1180.senateElections=senateElectionsRes.data||[];
    svBallot1180.senateCandidates=senateCandidatesRes.data||[];
    svBallot1180.senateTallies=senateTalliesRes.data||[];
    svBallot1180.senateVotes=senateVotesRes.data||[];
    svBallot1180.comments=commentsRes.data||[];
  }

  function svCards1180(){
    const cards=[];

    svBallot1180.propositions
      .filter(p=>svOpen1180(p)||svRecentClosed1180(p))
      .forEach(p=>cards.push({
        open:svOpen1180(p),
        stamp:new Date(p.created_at||p.opens_at).getTime(),
        html:svPropositionCard1180(p)
      }));

    svBallot1180.houseElections
      .filter(e=>svOpen1180(e)||svRecentClosed1180(e))
      .forEach(e=>cards.push({
        open:svOpen1180(e),
        stamp:new Date(e.created_at||e.opens_at).getTime(),
        html:svElectionCard1180('house',e)
      }));

    svBallot1180.senateElections
      .filter(e=>svOpen1180(e)||svRecentClosed1180(e))
      .forEach(e=>cards.push({
        open:svOpen1180(e),
        stamp:new Date(e.created_at||e.opens_at).getTime(),
        html:svElectionCard1180('senate',e)
      }));

    cards.sort((a,b)=>Number(b.open)-Number(a.open)||b.stamp-a.stamp);
    return cards.map(x=>x.html).join('');
  }

  function svIsHome1180(){
    const title=document.querySelector('#sectionTitle')?.textContent?.trim();
    return title==='Home'||location.hash==='#home'||!location.hash;
  }

  function svRender1180(){
    const list=document.querySelector('#feedList');
    if(!list||!svIsHome1180()) return;

    /*
      Official ballots must live OUTSIDE #feedList.
      live-app-v1100.js replaces feedList.innerHTML whenever normal social
      posts refresh, which used to delete propositions/elections immediately.
    */
    const parent=list.parentElement;
    if(!parent) return;

    let host=parent.querySelector('#svBallotFeed1180');

    if(!host){
      host=document.createElement('div');
      host.id='svBallotFeed1180';
      host.className='sv-ballot-feed';
      host.dataset.pinnedCivicFeed='1';
      list.insertAdjacentElement('beforebegin',host);
    }else if(host.nextElementSibling!==list){
      /* Keep the official civic feed pinned directly above normal posts. */
      list.insertAdjacentElement('beforebegin',host);
    }

    const markup=svCards1180();
    host.innerHTML=markup;
    host.hidden=!markup;
  }

  async function svRefresh1180(){
    await svLoad1180();
    svRender1180();
  }

  document.addEventListener('click',async event=>{
    const propBtn=event.target.closest?.('[data-sv-prop-vote]');
    if(propBtn){
      event.preventDefault();
      const [idRaw,vote]=propBtn.dataset.svPropVote.split(':');
      const id=Number(idRaw);
      propBtn.disabled=true;

      const mine=svBallot1180.propositionVotes.find(v=>Number(v.proposition_id)===id);
      const query=mine
        ? svDb1180.from('proposition_votes').update({vote}).eq('proposition_id',id).eq('citizen_no',svBallot1180.profile.citizen_no)
        : svDb1180.from('proposition_votes').insert({proposition_id:id,vote});

      const {error}=await query;
      if(error) svToast1180(error.message);
      else svToast1180(mine?'Your proposition vote was changed.':'Your proposition vote was recorded.');

      await svRefresh1180();
      return;
    }

    const electionBtn=event.target.closest?.('[data-sv-election-vote]');
    if(electionBtn){
      event.preventDefault();
      const [kind,electionRaw,candidateRaw]=electionBtn.dataset.svElectionVote.split(':');
      const electionId=Number(electionRaw),candidateNo=Number(candidateRaw);
      const d=svElectionData1180(kind);
      const mine=d.votes.find(v=>Number(v.election_id)===electionId);
      const table=kind==='house'?'house_election_votes':'senate_election_votes';

      electionBtn.disabled=true;

      const query=mine
        ? svDb1180.from(table).update({candidate_citizen_no:candidateNo}).eq('election_id',electionId).eq('voter_citizen_no',svBallot1180.profile.citizen_no)
        : svDb1180.from(table).insert({election_id:electionId,candidate_citizen_no:candidateNo});

      const {error}=await query;
      if(error) svToast1180(error.message);
      else svToast1180(mine?'Your election vote was changed.':'Your election vote was recorded.');

      await svRefresh1180();
    }
  },true);

  document.addEventListener('submit',async event=>{
    const form=event.target.closest?.('[data-sv-ballot-comment]');
    if(!form) return;

    event.preventDefault();

    const [kind,idRaw]=form.dataset.svBallotComment.split(':');
    const body=form.querySelector('textarea')?.value.trim();
    if(!body) return;

    const button=form.querySelector('button');
    if(button) button.disabled=true;

    const {error}=await svDb1180.from('civic_ballot_comments').insert({
      ballot_kind:kind,
      ballot_id:Number(idRaw),
      citizen_no:svBallot1180.profile.citizen_no,
      body
    });

    if(error) svToast1180(error.message);
    else svToast1180('Comment posted.');

    await svRefresh1180();
  },true);

  /* Correct the older Elections-page wording now that ballots are changeable. */
  function svFixLegacyBallotCopy1180(){
    document.querySelectorAll('#view .live-vote-status').forEach(el=>{
      const text=el.textContent||'';
      if(text.includes('Your ballot is final once submitted.')){
        el.textContent='Your ballot may be changed from the Home feed until voting closes. Individual ballots remain private.';
      }

  }

  let svDomTimer1180=null;
  const svView1180=document.querySelector('#view');
  if(svView1180){
    const observer=new MutationObserver(()=>{
      clearTimeout(svDomTimer1180);
      svDomTimer1180=setTimeout(()=>{
        svRender1180();
        svFixLegacyBallotCopy1180();
      },45);
    });
    observer.observe(svView1180,{childList:true,subtree:true});
  }

  await svRefresh1180();

  let svRealtimeTimer1180=null;
  const svSchedule1180=()=>{
    clearTimeout(svRealtimeTimer1180);
    svRealtimeTimer1180=setTimeout(svRefresh1180,140);
  };

  svDb1180.channel('starvalla-social-ballots-v1180')
    .on('postgres_changes',{event:'*',schema:'public',table:'propositions'},svSchedule1180)
    .on('postgres_changes',{event:'*',schema:'public',table:'proposition_votes'},svSchedule1180)
    .on('postgres_changes',{event:'*',schema:'public',table:'house_elections'},svSchedule1180)
    .on('postgres_changes',{event:'*',schema:'public',table:'house_candidates'},svSchedule1180)
    .on('postgres_changes',{event:'*',schema:'public',table:'house_election_votes'},svSchedule1180)
    .on('postgres_changes',{event:'*',schema:'public',table:'senate_elections'},svSchedule1180)
    .on('postgres_changes',{event:'*',schema:'public',table:'senate_candidates'},svSchedule1180)
    .on('postgres_changes',{event:'*',schema:'public',table:'senate_election_votes'},svSchedule1180)
    .on('postgres_changes',{event:'*',schema:'public',table:'civic_ballot_comments'},svSchedule1180)
    .subscribe();

  svDb1180.auth.onAuthStateChange(()=>setTimeout(svRefresh1180,0));

  <script>
  (() => {
    'use strict';

    const state1182 = {
      modal:null,
      body:null,
      movedComposer:null,
      originalParent:null,
      originalNextSibling:null,
      returnHash:null,
      navigatedForCompose:false
    };

    function icon1182(){
      return `
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 18.5H18a3.5 3.5 0 0 0 .5-6.97A5.5 5.5 0 0 0 8.24 8.7 4.5 4.5 0 0 0 7 18.5Z"
                  stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 18V9.35" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            <path d="M8.9 12.4 12 9.3l3.1 3.1" stroke="currentColor" stroke-width="1.9"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>`;
    }

    function makeComposeButton1182(){
      const btn=document.createElement('button');
      btn.type='button';
      btn.id='svComposeNavBtn1182';
      btn.className='bottom-link sv-compose-nav-btn';
      btn.setAttribute('aria-label','Create post');
      btn.setAttribute('title','Create post');
      btn.innerHTML=icon1182();
      btn.addEventListener('click',openCompose1182);
      return btn;
    }

    function ensureComposeButton1182(){
      const nav=document.querySelector('#bottomNav');
      if(!nav) return;

      let btn=nav.querySelector('#svComposeNavBtn1182');
      if(btn) return;

      btn=makeComposeButton1182();

      const native=[...nav.children];
      /* Home, Citizens, Compose, Elections/Messages..., etc. */
      nav.insertBefore(btn,native[2]||null);
    }

    /*
      The original app rebuilds #bottomNav on every route change.
      MutationObserver callbacks run before the browser paints, so reinserting
      the sixth button here prevents the visible disappear/reappear flash.
    */
    const bottomNav1182=document.querySelector('#bottomNav');
    if(bottomNav1182){
      const navObserver1182=new MutationObserver(()=>{
        ensureComposeButton1182();
      });
      navObserver1182.observe(bottomNav1182,{childList:true});
    }

    /* Also wrap the app's global renderer when available for same-call insertion. */
    if(typeof window.renderNav==='function'&&!window.__svRenderNav1182){
      window.__svRenderNav1182=true;
      const originalRenderNav1182=window.renderNav;
      window.renderNav=function(...args){
        const result=originalRenderNav1182.apply(this,args);
        ensureComposeButton1182();
        return result;
      };
    }

    function inlineComposers1182(){
      return [...document.querySelectorAll('#view .composer')]
        .filter(el=>el.querySelector('#postText'));
    }

    function hideInlineComposer1182(){
      inlineComposers1182().forEach(el=>{
        if(!el.closest('#svComposeOverlay1182')){
          el.classList.add('sv-inline-composer-hidden');
        }
      });
    }

    const view1182=document.querySelector('#view');
    if(view1182){
      const viewObserver1182=new MutationObserver(()=>{
        hideInlineComposer1182();
      });
      viewObserver1182.observe(view1182,{childList:true,subtree:true});
    }

    function ensureModal1182(){
      if(state1182.modal) return;

      const overlay=document.createElement('div');
      overlay.id='svComposeOverlay1182';
      overlay.className='sv-compose-overlay';
      overlay.innerHTML=`
        <div class="sv-compose-shell" role="dialog" aria-modal="true" aria-labelledby="svComposeTitle1182">
          <div class="sv-compose-head">
            <div>
              <h3 id="svComposeTitle1182">Create post</h3>
              <small>Share an update with Starvalla.</small>
            </div>
            <button type="button" class="sv-compose-close" aria-label="Close composer">×</button>
          </div>
          <div class="sv-compose-body">
            <div class="sv-compose-loading">Loading composer…</div>
          </div>
        </div>`;

      document.body.appendChild(overlay);
      overlay.querySelector('.sv-compose-close')?.addEventListener('click',closeCompose1182);
      overlay.addEventListener('click',event=>{
        if(event.target===overlay) closeCompose1182();
      });

      document.addEventListener('keydown',event=>{
        if(event.key==='Escape'&&overlay.classList.contains('show')){
          closeCompose1182();
        }
      });

      state1182.modal=overlay;
      state1182.body=overlay.querySelector('.sv-compose-body');
    }

    function findComposer1182(){
      return inlineComposers1182()[0]||null;
    }

    function waitForComposer1182(timeout=3000){
      return new Promise(resolve=>{
        const immediate=findComposer1182();
        if(immediate){ resolve(immediate); return; }

        const started=Date.now();
        const timer=setInterval(()=>{
          const found=findComposer1182();
          if(found||Date.now()-started>=timeout){
            clearInterval(timer);
            resolve(found||null);
          }
        },40);
      });
    }

    async function getComposer1182(){
      let composer=findComposer1182();
      if(composer) return composer;

      /*
        The composer is only created by the Home route. If the user taps Post
        from another page, briefly render Home behind the modal, then restore
        the original route when the composer closes.
      */
      state1182.returnHash=location.hash||'#home';
      if(state1182.returnHash!=='#home'){
        state1182.navigatedForCompose=true;
        const homeButton=document.querySelector('#bottomNav [data-route="home"]');
        if(homeButton) homeButton.click();
        else location.hash='#home';
      }

      composer=await waitForComposer1182();
      return composer;
    }

    function restoreComposer1182(){
      if(!state1182.movedComposer||!state1182.originalParent) return;

      if(state1182.originalNextSibling&&state1182.originalNextSibling.parentNode===state1182.originalParent){
        state1182.originalParent.insertBefore(state1182.movedComposer,state1182.originalNextSibling);
      }else{

  (async () => {

    async function sniffFile1210(file){
      const bytes=new Uint8Array(await file.slice(0,32).arrayBuffer());
      if(bytes.length<12) return null;

      if(bytes[0]===0xff && bytes[1]===0xd8 && bytes[2]===0xff){
        return {kind:'image',mime:'image/jpeg',ext:'jpg'};
      }
      if(
        bytes[0]===0x89 && bytes[1]===0x50 && bytes[2]===0x4e && bytes[3]===0x47 &&
        bytes[4]===0x0d && bytes[5]===0x0a && bytes[6]===0x1a && bytes[7]===0x0a
      ){
        return {kind:'image',mime:'image/png',ext:'png'};
      }
      if(ascii1210(bytes,0,4)==='RIFF' && ascii1210(bytes,8,12)==='WEBP'){
        return {kind:'image',mime:'image/webp',ext:'webp'};
      }
      if(bytes[0]===0x1a && bytes[1]===0x45 && bytes[2]===0xdf && bytes[3]===0xa3){
        return {kind:'video',mime:'video/webm',ext:'webm'};

      if(ascii1210(bytes,4,8)==='ftyp'){
        const brand=ascii1210(bytes,8,16).toLowerCase();
        if(
          brand.includes('heic') || brand.includes('heix') || brand.includes('hevc') ||
          brand.includes('mif1') || brand.includes('msf1')
        ) return null;
        const quicktime=brand.includes('qt');
        return {
          kind:'video',
          mime:quicktime?'video/quicktime':'video/mp4',
          ext:quicktime?'mov':'mp4'
        };
      }
      return null;

          const photos=state1210.files.filter(x=>x.kind==='image').length;
          const videos=state1210.files.filter(x=>x.kind==='video').length;
          const mb=state1210.files.reduce((sum,x)=>sum+x.file.size,0)/1048576;
          const parts=[];
          if(photos) parts.push(photos+' photo'+(photos===1?'':'s'));
          if(videos) parts.push(videos+' video'+(videos===1?'':'s'));

        }
      }

      if(!previews) return;
      previews.innerHTML=state1210.files.map((item,index)=>{
        const url=URL.createObjectURL(item.file);
        state1210.previewUrls.push(url);
        const media=item.kind==='video'
          ? `<video src="${esc1210(url)}" muted playsinline preload="metadata"></video>`
          : `<img src="${esc1210(url)}" alt="Selected media preview">`;
        return `<div class="photo-preview">${media}<button type="button" data-sv-remove-secure-media="${index}">×</button></div>`;
      }).join('');

      previews.querySelectorAll('[data-sv-remove-secure-media]').forEach(button=>{
        button.addEventListener('click',()=>{
          state1210.files.splice(Number(button.dataset.svRemoveSecureMedia),1);
          drawSecurePreviews1210();
        });
      });
    }

    function hardenComposer1210(){
      const input=document.querySelector('#postImageInput');
      if(!input) return;

      if(state1210.input!==input){
        state1210.input=input;
        state1210.files=[];
        clearPreviewUrls1210();
      }

      input.setAttribute(
        'accept',
        'image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime'
      );

      const small=input.closest('.post-media-picker-row')?.querySelector('small');
      if(small){
        small.textContent='Reviewed before publication · JPG/PNG/WebP · video up to 25 MB';
      }

      const picker=document.querySelector('#postMediaPicker');
      if(picker && !picker.querySelector('.sv-media-review-note')){
        const note=document.createElement('div');
        note.className='sv-media-review-note';
        note.innerHTML='<strong>Media safety:</strong> photos and videos are quarantined and reviewed before they can appear publicly.';
        picker.appendChild(note);

    async function handleMediaSelection1210(event){
      const input=event.target.closest?.('#postImageInput');
      if(!input) return;

      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();

      hardenComposer1210();

      const incoming=Array.from(input.files||[]);
      if(!incoming.length) return;

      for(const file of incoming){
        if(state1210.files.length>=MAX_ITEMS_1210){
          showToast1210('A post can contain at most 4 media items.');
          break;
        }

        const sniffed=await sniffFile1210(file).catch(()=>null);
        if(!sniffed || !ALLOWED_MIME_1210.has(sniffed.mime)){
          showToast1210((file.name||'That file')+' is not an allowed JPG, PNG, WebP, MP4, WebM, or QuickTime file.');
          continue;
        }

        const browserMime=String(file.type||'').toLowerCase();
        if(browserMime && !ALLOWED_MIME_1210.has(browserMime)){
          showToast1210((file.name||'That file')+' has an unsupported media type.');
          continue;
        }

        const max=sniffed.kind==='video'?MAX_VIDEO_1210:MAX_IMAGE_1210;
        if(file.size<1 || file.size>max){
          showToast1210((file.name||'That file')+' is too large for Starvalla media.');
          continue;
        }

        const total=state1210.files.reduce((sum,item)=>sum+item.file.size,0);
        if(total+file.size>MAX_TOTAL_1210){
          showToast1210('Total media for one post must stay under 40 MB.');
          continue;
        }

        const duplicate=state1210.files.some(item=>
          item.file.name===file.name &&
          item.file.size===file.size &&
          item.file.lastModified===file.lastModified
        );

        if(!duplicate){
          state1210.files.push({...sniffed,file});
        }
      }

      input.value='';
      drawSecurePreviews1210();

      if(state1210.files.length){
        showToast1210('Media selected. It will be reviewed before publication.');
      }
    }

    async function cleanupFailedUpload1210(postId,paths){
      if(paths.length){
        await state1210.db.storage.from('post-media-quarantine').remove(paths).catch(()=>{});
      }
      if(postId){
        await state1210.db.from('posts').delete().eq('id',postId).catch(()=>{});
      }

    async function submitMediaPost1210(button){
      const composer=button.closest('.composer')||document.querySelector('.composer');
      const textarea=composer?.querySelector('#postText');
      const body=textarea?.value?.trim()||'';

      if(!state1210.files.length) return;

      const sessionResult=await state1210.db.auth.getSession();
      const session=sessionResult.data?.session;
      if(!session?.user){
        document.querySelector('#accountBtn')?.click();
        return;
      }

      button.disabled=true;
      const originalText=button.textContent;
      button.textContent='Sending to review…';

      let postId=null;
      const uploaded=[];

      try{
        const created=await state1210.db.rpc('create_pending_media_post',{p_body:body});
        if(created.error) throw created.error;
        postId=Number(created.data);
        if(!postId) throw new Error('Pending post could not be created.');

        for(let i=0;i<state1210.files.length;i++){
          const item=state1210.files[i];
          const key=crypto.randomUUID?.() || (Date.now()+'-'+i);
          const path=session.user.id+'/'+postId+'/'+key+'.'+item.ext;

          const up=await state1210.db.storage
            .from('post-media-quarantine')
            .upload(path,item.file,{
              contentType:item.mime,
              cacheControl:'0',
              upsert:false
            });

          if(up.error) throw up.error;
          uploaded.push(path);

          const row=await state1210.db.from('media_submissions').insert({
            post_id:postId,
            quarantine_path:path,
            media_type:item.kind,
            original_filename:String(item.file.name||'').slice(0,240),
            declared_mime:item.mime,
            byte_size:item.file.size,
            position:i+1
          });

          if(row.error) throw row.error;
        }

        if(textarea) textarea.value='';
        state1210.files=[];
        clearPreviewUrls1210();
        const input=document.querySelector('#postImageInput');
        if(input) input.value='';
        drawSecurePreviews1210();

        showToast1210('Submitted for media review. It will appear after approval.');

        /*
          Media posting is intercepted by the quarantine module before the
          legacy composer click handler runs. Close the composer here, only
          after the pending post + all quarantined uploads have succeeded.
        */
        document.querySelector('#svComposeOverlay1182 .sv-compose-close')?.click();
      }catch(error){
        console.error('Starvalla quarantine upload failed',error);
        await cleanupFailedUpload1210(postId,uploaded);
        showToast1210('Media submission failed: '+(error?.message||'unknown error'));
      }finally{
        button.disabled=false;
        button.textContent=originalText||'Post';
      }
    }

    async function renderFounderReview1210(){
      const view=document.querySelector('#view');
      if(!view) return;

      setCustomPageShell1210('Media Review');
      view.innerHTML='<div class="card"><h3>Loading quarantine queue…</h3></div>';

          </section>
          ${cards.length?cards.join(''):`<section class="card sv-moderation-empty"><span class="sv-empty-icon">✓</span><h3>Review queue is clear</h3><p class="muted">No photo or video posts are waiting for review.</p></section>`}
        </div>`;

      view.querySelectorAll('[data-sv-approve-post]').forEach(button=>{
        button.addEventListener('click',()=>reviewDecision1210(Number(button.dataset.svApprovePost),'approve',button));
      });
      view.querySelectorAll('[data-sv-reject-post]').forEach(button=>{

    async function reviewDecision1210(postId,decision,button,reason=''){
